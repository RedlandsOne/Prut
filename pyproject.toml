[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prut"
version = "0.1.0"
description = "A small, modern programming language built from scratch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
{name = "Prut Contributors"}
]
dependencies = []

[project.optional-dependencies]
dev = [
"pytest>=8.0"
]

[project.scripts]
prut = "prut.main:main"

[tool.setuptools.packages.find]
where = ["src"]
