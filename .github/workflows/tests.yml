name: Tests

on:
push:
pull_request:

jobs:
test:
name: Run Prut tests
runs-on: ubuntu-latest

```
steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Prut
    run: python -m pip install -e ".[dev]"

  - name: Run tests
    run: pytest
```
